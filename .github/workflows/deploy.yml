name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # /orb serves Orb's latest release: an hourly run deploys a release the site doesn't serve yet.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  orb:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      asset: ${{ steps.latest.outputs.asset }}
      deploy: ${{ steps.latest.outputs.deploy }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo OrdalieTech/orb --json tagName -q .tagName)"
          asset="$(gh release view "$tag" --repo OrdalieTech/orb --json assets -q '.assets[].name | select(endswith("_browser.tar.gz"))')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != schedule ] || { [ -n "$asset" ] && ! curl -fsS https://netapy.com/orb/ | grep -qF "<base href=\"${tag#v}-"; }; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: orb
    if: needs.orb.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: draw/package-lock.json
      - name: Build and test drawing page
        working-directory: draw
        run: npm ci && npm test && npm run build
      - name: Add Orb's latest release under /orb
        if: needs.orb.outputs.asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.orb.outputs.tag }}
          ASSET: ${{ needs.orb.outputs.asset }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo OrdalieTech/orb -p checksums.txt -p checksums.txt.sig -p "$ASSET"
          # Only what Orb's release key signed is published: the key `orb update` trusts (platforms/native/selfupdate).
          printf -- '-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEA/xaew4KpYjMRLnDkPbbkbUgToYycCEv5Ur5LWpfLMTc=\n-----END PUBLIC KEY-----\n' > orb.pem
          openssl pkeyutl -verify -pubin -inkey orb.pem -rawin -in checksums.txt -sigfile checksums.txt.sig
          grep -F "  $ASSET" checksums.txt | sha256sum -c
          mkdir "$GITHUB_WORKSPACE/dist/orb" && tar -xzf "$ASSET" -C "$GITHUB_WORKSPACE/dist/orb"
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=netapy --branch=${{ github.head_ref || github.ref_name }}
